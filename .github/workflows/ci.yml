name: Go Agent CI

on:
  push:
  pull_request:

concurrency:
  group: go-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: agent
          MYSQL_USER: agent
          MYSQL_PASSWORD: agent_test_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test_password"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
      - name: Verify unit, race, build, and MySQL integration tests
        env:
          AGENT_TEST_MYSQL_DSN: agent:agent_test_password@tcp(127.0.0.1:3306)/agent?parseTime=true&charset=utf8mb4&collation=utf8mb4_0900_ai_ci
        run: make verify-ci
